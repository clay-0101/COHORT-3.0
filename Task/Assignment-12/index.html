<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <section class="home">
            <nav>
                <h1>PRODUCTIVE DASHBOARD</h1>
                <div style="display: flex; gap:2vw">
                    <i class="ri-sun-line"></i>
                    <i class="ri-github-fill"></i>
                </div>
            </nav>
            <div class="weather">
                <div class="time">
                    <h6 style="font-size: 1.2rem;">July 7th, 2026</h6>
                    <h3 style="font-size: 3.9rem; margin-bottom: 0.5rem;">Tuesday, <br> <span id="current_Time"></span>
                    </h3>
                    <h5 style="font-size: 1.8rem;">Haryana</h5>
                </div>
                <div class="forcasting">
                    <h2>29.7°C</h2>
                    <h3 style="font-size: 2rem; margin-bottom: 3.5rem;">Patchy rain <br> nearby</h3>
                    <h6 style="font-size: 1rem;">Heat_Index: 34.1% <br>Humidity: 69%<br>Wind: 19.1km/h</h6>
                </div>
            </div>
            <div class="features">
                <div class="feature-1">
                    <img src="./assest/Checklist Icon.jpg" alt="">
                    
                </div>
                <div class="feature-2">
                    <img src="./assest/Calendrier pliant doodle dessiné à la main avec vecteur de style art dessin animé isolé _ Vecteur Premium.jpg" alt="">
                </div>
                <div class="feature-3"></div>
                <div class="feature-4"></div>
                <div class="feature-5"><i class="ri-hourglass-line"></i></div>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>

</html>
