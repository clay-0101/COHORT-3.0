<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <main>
        <button id="toggleBtn">Toggle Theme</button>
        <form action="">
            <input type="text" class="title" placeholder="Task Title" required maxlength="45">
            <input type="date" class="date" required>
            <select name="Category" class="category" required>
                <option value="" disabled selected>Select Category</option>
                <option value="Work">💼 Work </option>
                <option value="Personal">👤 Personal </option>
                <option value="Shopping">🛒 Shopping</option>
                <option value="Health & Fitness">❤️ Health & Fitness</option>
                <option value="Finance">💰 Finance</option>
                <option value="Education">📚 Education</option>
                <option value="Travel">✈️ Travel </option>
                <option value="Home">🏠 Home</option>
                <option value="Social">👥 Social </option>
                <option value="Urgent">🚨 Urgent</option>
            </select>
            <button class="addBtn">+ Add Task</button>
        </form>

        <div id="task-list">
            <div class="empty">
                <i class="ri-todo-line"></i>
                <h1>No tasks right now.</h1>
                <p>Fill out the form above and add your first task!</p>
            </div>
            <div class="task-container">

            </div>
        </div>

        <div class="edit-container">
            <div class="edit-div">
                <div class="border">
                    <form action="">
                        <input type="text" class="title" placeholder="Task Title" required maxlength="45">
                        <input type="date" class="date" required>
                        <select name="Category" class="category" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Work">💼 Work </option>
                            <option value="Personal">👤 Personal </option>
                            <option value="Shopping">🛒 Shopping</option>
                            <option value="Health & Fitness">❤️ Health & Fitness</option>
                            <option value="Finance">💰 Finance</option>
                            <option value="Education">📚 Education</option>
                            <option value="Travel">✈️ Travel </option>
                            <option value="Home">🏠 Home</option>
                            <option value="Social">👥 Social </option>
                            <option value="Urgent">🚨 Urgent</option>
                        </select>
                        <button class="addBtn">Update Task</button>
                        <button type="button" class="cancel">Cancel</button>
                    </form>
                </div>
            </div>
        </div>
        <div class="toasterContainer">
        </div>

    </main>
    <script src="script.js"></script>
</body>

</html>
