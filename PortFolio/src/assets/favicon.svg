<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fe9ff" />
      <stop offset="100%" stop-color="#3fb8e0" />
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#08090a" />

  <!-- faint corner ticks, echoing the site's frame corners -->
  <path d="M8 16 V8 H16" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.6" fill="none" stroke-linecap="round" />
  <path d="M56 48 V56 H48" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.6" fill="none" stroke-linecap="round" />

  <!-- C mark: open arc -->
  <path
    d="M43 21.5
       C39 17.8 33.6 16.4 28.4 18.1
       C20.8 20.6 16.2 28.4 18.1 36.1
       C20 43.8 27.9 48.4 35.6 46.5
       C40 45.4 43.5 42.5 45.4 38.7"
    fill="none"
    stroke="url(#cyanGlow)"
    stroke-width="6.4"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />

  <!-- blinking cursor accent at the open end, standing in for the 'active/coding' dot -->
  <rect x="44.5" y="35.5" width="5.4" height="9.2" rx="1.4" fill="#f0efe9" />
</svg>
